appId: com.obwoj1.breakflow
productName: Break Flow
directories:
  output: dist
files:
  - out/**
  - resources/**
  - package.json
extraResources:
  # The Swift helper ships next to the app's code: Break Flow.app/Contents/Resources/bin/
  - from: helper/.build/release/BreakFlowHelper
    to: bin/BreakFlowHelper
npmRebuild: false
mac:
  target: dir
  category: public.app-category.productivity
  icon: build-resources/icon.icns # made by scripts/make-app-icon.swift
  # electron-builder doesn't sign; scripts/sign-app.mjs signs with the Break Flow Dev certificate.
  identity: null
  extendInfo:
    NSMicrophoneUsageDescription: Break Flow records your voice while you hold the hotkey so it can turn it into text.
